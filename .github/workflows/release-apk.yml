name: Build release APK

on:
  push:

permissions:
  contents: write

jobs:
  build-and-release:
    if: ${{ !contains(github.event.head_commit.message, '[skip apk]') }}
    runs-on: ubuntu-latest
    concurrency:
      group: release-apk
      cancel-in-progress: false

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate next release version
        id: app_version
        run: |
          LATEST_TAG=$(git tag --list --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+$' | head -n 1)
          if [ -z "$LATEST_TAG" ]; then
            VERSION_NAME="1.0"
          else
            VERSION_NAME=${LATEST_TAG#v}
            MAJOR_VERSION=${VERSION_NAME%%.*}
            MINOR_VERSION=${VERSION_NAME#*.}
            VERSION_NAME="$MAJOR_VERSION.$((MINOR_VERSION + 1))"
          fi
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Set up Node for sharing API tests
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Test sharing API
        run: |
          node cloudflare/test/worker.test.mjs
          node cloudflare/test/provision.test.mjs

      - name: Test web UI in Chromium
        run: |
          pip install playwright
          playwright install --with-deps chromium
          python cloudflare/test/ui_smoke.py

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "MY_PARKING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          MY_PARKING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MY_PARKING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MY_PARKING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          MY_PARKING_VERSION_NAME: ${{ steps.app_version.outputs.name }}
          MY_PARKING_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease --no-daemon

      - name: Keep signed APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyParking-${{ steps.app_version.outputs.name }}-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.app_version.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: MyParking ${{ steps.app_version.outputs.name }}
          prerelease: true
          generate_release_notes: true
          files: app/build/outputs/apk/release/app-release.apk
          overwrite_files: true

