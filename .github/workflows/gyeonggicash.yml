name: GyeonggiCash signed APK
on:
  push:
    branches: [build/gyeonggicash]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: layland/GyeonggiCash
          ref: main
          persist-credentials: false
      - name: Record source revision
        run: echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/gyeonggicash.jks"
      - name: Test, lint and build signed APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/gyeonggicash.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          bash tools/test.sh
          gradle --no-daemon :app:lintRelease :app:assembleRelease
      - name: Verify signature and packaged identity
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          mkdir -p dist
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" > dist/signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" > "$RUNNER_TEMP/cash-badging.txt"
          grep -F "name='kr.local.timedclick'" "$RUNNER_TEMP/cash-badging.txt"
          grep -F "versionName='$VERSION_NAME'" "$RUNNER_TEMP/cash-badging.txt"
          grep -F "versionCode='$VERSION_CODE'" "$RUNNER_TEMP/cash-badging.txt"
          cp "$apk" "dist/GyeonggiCash-$VERSION_NAME.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS)
      - name: Publish signed build for GyeonggiCash
        run: |
          set -euo pipefail
          printf 'GyeonggiCash signed build\nSource: https://github.com/layland/GyeonggiCash/commit/%s\nFinal download: https://github.com/layland/GyeonggiCash/releases\n' "$SOURCE_SHA" > "$RUNNER_TEMP/cash-notes.txt"
          gh release create "gyeonggicash-v$VERSION_NAME" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "GyeonggiCash $VERSION_NAME" --notes-file "$RUNNER_TEMP/cash-notes.txt" --latest=false
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/gyeonggicash.jks"
