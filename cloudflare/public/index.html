<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#1a2435" media="(prefers-color-scheme: dark)"><title>우리집 주차 예약</title><link rel="stylesheet" href="style.css"><script src="app.js" defer></script></head>
<body>
<header><h1>우리집 주차 예약</h1></header>
<main>
<p id="browser-note" hidden>Android 앱에서 열어 주세요.</p>
<section id="reserve" class="page">
<div class="balance"><div><span class="balance-label">잔여 시간</span><strong id="remaining">앱 연결 중…</strong></div><button id="refresh-time" class="subtle">새로고침</button></div>
<article><div class="section-heading"><h2>방문 일정</h2></div><div class="chips"><button data-offset="0">오늘</button><button data-offset="1">내일까지</button><button data-offset="2">모레까지</button></div><div class="date-grid"><label>시작일<input id="start" type="date"></label><label>종료일<input id="end" type="date"></label></div><p id="period" class="summary"></p></article>
<article><div class="section-heading"><h2>방문 차량</h2><button id="open-vehicles" class="subtle push">저장 차량</button></div><label>방문자 이름 <span class="optional">선택</span><input id="name" autocomplete="off" maxlength="40" placeholder="방문자 이름"></label><label>차량번호<input id="number" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="12" placeholder="예: 12가3456"></label><button id="save-vehicle" class="secondary">이 차량 저장</button></article>
<div class="action-area"><button id="register" class="primary">방문예약 등록 <span>→</span></button><button id="site" class="subtle full">공식 예약 사이트 열기</button></div>
</section>
<section id="history" class="page" hidden><div class="page-heading"><div><h2>예약 내역</h2></div><button id="sync" class="secondary">새로고침</button></div><p id="sync-state" class="hint" role="status" hidden></p><div id="history-list"></div><button id="more" class="secondary full" hidden>이전 내역 더 보기</button></section>
<section id="settings" class="page" hidden><div class="page-heading"><div><h2>가족 연결</h2></div></div><article id="connect-card"><label>내 표시 이름<input id="label" maxlength="30" placeholder="예: 본인 또는 배우자" autocomplete="off"></label><button id="create-family" class="primary">가족 공간 만들기</button><hr class="divider"><label>초대 코드<input id="invite-code" maxlength="32" placeholder="받은 일회용 코드" autocomplete="off" autocapitalize="off" spellcheck="false"></label><button id="join-family" class="secondary full">초대 코드로 연결</button></article><article id="connected-card" hidden><h3 id="family-label">가족에 연결됨</h3><div id="devices"></div><button id="invite" class="secondary full">배우자 초대</button><div id="invite-result" hidden><p class="hint">24시간 내 1회 사용</p><input id="generated-code" readonly aria-label="초대 코드"><button id="share-invite" class="secondary full">초대 코드 공유</button></div><button id="import-history" class="subtle full">기존 내역 공유</button><button id="leave" class="danger full">이 기기 가족 연결 해제</button></article><button id="native-screen" class="subtle full">기존 앱 화면 열기</button></section>
</main>
<nav aria-label="주 메뉴"><button data-page="reserve" class="active"><span aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span>예약하기</button><button data-page="history"><span aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg></span>예약 내역</button><button data-page="settings"><span aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7M5 9v11h14V9M10 20v-7h4v7"/></svg></span>가족 설정</button></nav>
<div id="notice" role="status" aria-live="polite" hidden></div>
<dialog id="vehicles"><div class="page-heading"><h2>저장 차량</h2><button id="close-vehicles" class="subtle">닫기</button></div><div id="vehicle-list"></div><button id="delete-vehicle" class="danger full">선택 차량 삭제</button></dialog>
</body></html>
